<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 350px;">
        <h3 class="text-center mb-3">Login</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center text-danger mt-2" id="errorMessage" style="display: none;">Username atau Password salah!</p>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Mencegah form submit normal

        // Ambil nilai input
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // Contoh validasi sederhana (ubah sesuai kebutuhan)
        if (username === "admin" && password === "12345") {
            alert("Login berhasil!");
            window.location.href = "asalan.html"; // Arahkan ke halaman utama
        } else {
            document.getElementById("errorMessage").style.display = "block";
        }
    });
</script>

</body>
</html>
